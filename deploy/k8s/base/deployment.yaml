# REFERENCE ONLY. Not applied anywhere. See ../README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command
  labels:
    app.kubernetes.io/name: command
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # a new version must be ready before an old one is stopped
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: command
  template:
    metadata:
      labels:
        app.kubernetes.io/name: command
    spec:
      serviceAccountName: command
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: command
      containers:
        - name: command
          # Always by digest, never by tag. The overlay sets the real registry and digest.
          image: REGISTRY/REPOSITORY@sha256:REPLACE_WITH_THE_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: command-settings
            - secretRef:
                name: command-secrets
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          # Starting values, to be replaced by measured ones before real use.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # /healthz answers from the server itself, without the database, so a database outage does not make
          # Kubernetes restart healthy containers.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
