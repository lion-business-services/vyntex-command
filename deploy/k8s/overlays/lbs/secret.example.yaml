# REFERENCE ONLY, and an EXAMPLE: this file holds names, never values, and is not listed in kustomization.yaml.
# LBS Command (Lion Business Services only).
#
# Do not fill this in and apply it. A Secret written in a file ends up in Git or on a laptop. Create the real one
# from a secret store (the cloud provider's secret manager through the External Secrets operator or the Secrets
# Store CSI driver), with encryption of Secrets at rest switched on in the cluster.
#
# Every value below is different from the other deployment's value. The full list with what each one is for is in
# docs/security/secrets-and-environments.md and .env.example.
apiVersion: v1
kind: Secret
metadata:
  name: command-secrets
  namespace: lbs-command
type: Opaque
stringData:
  SUPABASE_URL: REPLACE_FROM_SECRET_STORE
  SUPABASE_ANON_KEY: REPLACE_FROM_SECRET_STORE
  SUPABASE_SERVICE_ROLE_KEY: REPLACE_FROM_SECRET_STORE
  SESSION_SECRET: REPLACE_FROM_SECRET_STORE
  TOKEN_ENC_KEY: REPLACE_FROM_SECRET_STORE
  IP_HASH_SALT: REPLACE_FROM_SECRET_STORE
  CRON_SECRET: REPLACE_FROM_SECRET_STORE
  RESEND_API_KEY: REPLACE_FROM_SECRET_STORE
