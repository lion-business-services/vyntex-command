# Looks for keys and tokens in the code, two ways:
#   1. this repository's own scan of the working tree (scripts/security/scan-secrets.mjs), plus the personal data scan
#   2. gitleaks, which also reads the Git history of the pull request or push
#
# The first job uses no secrets and runs for every pull request, including one from a fork.
# The second needs a licence key when the repository belongs to an organization (GITLEAKS_LICENSE, see
# docs/security/github-settings.md, step 7), so it is skipped for pull requests from forks, which never receive
# secrets. Nothing here uses "pull_request_target".
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # once a week over the full history, in case a new rule finds an old mistake
    - cron: "41 9 * * 1"

permissions: {}

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  working-tree:
    name: Keys and personal data in the files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # These two scripts use nothing but Node itself, so no libraries are installed.
      - name: Secret scan
        run: node scripts/security/scan-secrets.mjs
      - name: Personal data scan
        run: node scripts/security/scan-pii.mjs

  gitleaks:
    name: Keys in the Git history (gitleaks)
    # Skipped for forks: they get no secrets, and the licence key is one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read   # to list the commits of the pull request it scans
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # the whole history, so gitleaks can read every commit in range
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # findings stay in the job log; no comment is written on the pull request and no file is uploaded
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
