# Code scanning: GitHub's CodeQL reads the JavaScript and TypeScript code (pages, server functions, scripts) and the
# workflow files, and reports patterns that lead to vulnerabilities. Results appear under Security, Code scanning.
#
# On a private repository this needs GitHub Code Security to be enabled for the repository (a paid product at the
# time of writing; confirm on GitHub's pricing page). Without it this workflow fails at the upload step.
# docs/security/github-settings.md, step 6, covers the decision.
#
# No secrets are used. Actions are pinned to full commits.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # once a week, so new queries are run against code that did not change
    - cron: "23 9 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read            # needed by CodeQL on a private repository, to read the run it is part of
      security-events: write   # to upload the results; nothing else
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
